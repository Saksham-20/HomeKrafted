name: CI

# A test suite nobody runs is documentation with a build step. This is what
# makes the M15/M16 rules — a review needs a delivered order, a seller
# cannot verify themselves, revenue is a line-item share — actually guard
# anything.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: client — typecheck, lint, unit, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The build type-checks the app the way Next does it, and is the only
      # place a broken route file or a bad `metadata` export shows up.
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://homekrafted.in

  server:
    name: server — typecheck, lint, unit, e2e, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    # A real Postgres, because every rule worth guarding on this server is
    # enforced by a query. A mocked Prisma would let these tests pass while
    # the query said something else entirely.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: homekrafted
          POSTGRES_PASSWORD: homekrafted
          POSTGRES_DB: homekrafted_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://homekrafted:homekrafted@localhost:5432/homekrafted_test?schema=public

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint:check

      # No database needed: pure functions and services built with a stub.
      - name: Unit tests
        run: npm test

      # A model edit with no migration behind it works locally — `prisma
      # generate` reads the schema, so the types and the client are right
      # and every test passes — and then simply never reaches production,
      # because a deploy runs `migrate deploy`. M23 found exactly this in
      # the other direction: a `DEFAULT` left on `CorporateInquiry.updatedAt`
      # by a migration and never declared in the schema, quietly making
      # every later `migrate diff` emit drift that wasn't ours.
      - name: Schema matches its migrations
        run: |
          psql "$TEST_DATABASE_URL" -c 'CREATE DATABASE ci_shadow;'
          SHADOW_DATABASE_URL='postgresql://homekrafted:homekrafted@localhost:5432/ci_shadow?schema=public' \
            npm run prisma:check-drift

      # `migrate deploy`, not `db push` — this also proves the migration
      # lineage still applies cleanly to an empty database, which is the
      # thing that breaks on a deploy and nowhere earlier.
      - name: Apply migrations to the test database
        run: npm run test:e2e:setup

      - name: End-to-end tests
        run: npm run test:e2e

      - run: npm run build

  browser:
    name: browser — Playwright against a real stack
    runs-on: ubuntu-latest

    # The layer the other two jobs cannot reach. `docs/PRODUCTION-AUDIT.md`
    # item 21 asked for this and the 2026-08-07 audit is why it exists: a
    # Save button that did nothing and said nothing, a Place-order button
    # that charged twice on a double-click, a product card that was
    # focusable and un-openable from a keyboard, and two dialogs claiming
    # `aria-modal` while trapping nothing. Every one of those passed the
    # whole suite above, because none of it opens a page.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: homekrafted
          POSTGRES_PASSWORD: homekrafted
          POSTGRES_DB: homekrafted_browser
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://homekrafted:homekrafted@localhost:5432/homekrafted_browser?schema=public
      # The specs drive the real UI, which means real sign-ins, real
      # searches and real page loads — well past a production throttle.
      # Raised here only; `money-races.e2e-spec.ts` is where the limiter
      # itself is tested.
      THROTTLE_LIMIT: '100000'
      THROTTLE_AUTH_LIMIT: '100000'
      JWT_SECRET: ci-access-secret-not-a-real-one
      JWT_REFRESH_SECRET: ci-refresh-secret-not-a-real-one
      PORT: '4100'
      CLIENT_ORIGIN: http://localhost:3100
      SITE_URL: http://localhost:3100
      NODE_ENV: development
      E2E_BASE_URL: http://localhost:3100
      E2E_API_URL: http://localhost:4100/api/v1

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install, build and seed the API
        working-directory: server
        run: |
          npm ci
          npx prisma generate
          npm run build
          npx prisma migrate deploy
          npx ts-node prisma/seed.ts
          npx ts-node prisma/seed-crafts.ts
          npx ts-node prisma/seed-meal-plans.ts

      - name: Build the web app
        working-directory: client
        run: npm ci && npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4100/api/v1
          NEXT_PUBLIC_SITE_URL: http://localhost:3100

      # Started as background steps rather than through Playwright's
      # `webServer`, so the seeding above is an explicit precondition
      # rather than something hidden in a test config — see
      # `e2e/playwright.config.ts`.
      - name: Start the API and the web app
        run: |
          (cd server && npm run start:prod &)
          (cd client && PORT=3100 npx next start &)
          npx wait-on http://localhost:4100/health http://localhost:3100 --timeout 120000

      - name: Browser tests
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

      - uses: actions/upload-artifact@v4
        # Only useful when something failed, and the traces are large.
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
